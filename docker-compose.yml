version: '3.9'

services:
  # ─── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: radif-mongo
    restart: unless-stopped
    networks:
      - radif-network
    volumes:
      - mongo-data:/data/db
    # No ports exposed — only reachable inside radif-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Node.js Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radif-backend
    restart: unless-stopped
    networks:
      - radif-network
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy

  # ─── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # مرورگر با همان دامنه به /api می‌زند و Next.js آن را به بکاند می‌فرستد
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SITE_URL: https://radif-ecu.ir
        NEXT_PUBLIC_GTM_ID: ""   # ← GTM-XXXXXXX
        BACKEND_ORIGIN: http://backend:5000
    container_name: radif-frontend
    restart: unless-stopped
    networks:
      - radif-network
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # برای درخواست‌های سمت سرور Next.js (sitemap، صفحهٔ مقاله)
      - INTERNAL_API_URL=http://backend:5000/api
    depends_on:
      - backend

# ─── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  mongo-data:
    driver: local

# ─── Custom Network ────────────────────────────────────────────────────────────
networks:
  radif-network:
    driver: bridge
